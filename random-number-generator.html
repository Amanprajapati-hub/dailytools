
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate random numbers instantly with the free DailyTools Random Number Generator.">
  <title>Random Number Generator | DailyTools</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .random-wrapper {
      max-width: 700px;
      margin: 60px auto;
      padding: 35px;
      background: #fff;
      border: 1px solid #e9e9f1;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(30, 30, 60, 0.06);
    }

    .random-wrapper h1 { margin-bottom: 12px; }

    .random-wrapper > p {
      color: #666;
      margin-bottom: 28px;
    }

    .random-field label {
      display: block;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .random-field input,
    .random-field select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
      margin-bottom: 20px;
      background: #fff;
    }

    .random-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #635bff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .random-button:hover { background: #5048e5; }

    .random-result {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #f5f5ff;
      border-radius: 14px;
      text-align: center;
    }

    .random-result span {
      display: block;
      color: #666;
      margin-bottom: 8px;
    }

    .random-result strong {
      display: block;
      font-size: 42px;
      color: #635bff;
      overflow-wrap: anywhere;
    }

    .random-error {
      display: none;
      color: #d93025;
      margin-top: 14px;
    }

    .random-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .random-actions button {
      flex: 1;
      padding: 12px;
      border: 1px solid #635bff;
      border-radius: 9px;
      background: white;
      color: #635bff;
      font-weight: 600;
      cursor: pointer;
    }

    .random-actions button:hover {
      background: #eeedff;
    }

    @media (max-width: 600px) {
      .random-wrapper {
        margin: 30px 15px;
        padding: 22px;
      }

      .random-result strong { font-size: 34px; }
    }
  </style>
</head>

<body>

  <main class="random-wrapper">
    <h1>Random Number Generator</h1>
    <p>Generate random numbers within your chosen range instantly.</p>

    <div class="random-field">
      <label for="minNumber">Minimum Number</label>
      <input type="number" id="minNumber" value="1" step="1">

      <label for="maxNumber">Maximum Number</label>
      <input type="number" id="maxNumber" value="100" step="1">

      <label for="quantity">How many numbers?</label>
      <input type="number" id="quantity" value="1" min="1" max="100" step="1">

      <label for="duplicateOption">Duplicate Numbers</label>
      <select id="duplicateOption">
        <option value="yes">Allow duplicates</option>
        <option value="no">No duplicates</option>
      </select>
    </div>

    <button class="random-button" id="generateBtn">
      Generate Random Number
    </button>

    <p class="random-error" id="errorMessage" role="alert"></p>

    <section class="random-result" id="result" aria-live="polite">
      <span>Your Random Number(s)</span>
      <strong id="randomNumbers"></strong>

      <div class="random-actions">
        <button id="copyBtn">Copy Results</button>
        <button id="againBtn">Generate Again</button>
      </div>
    </section>
  </main>

  <script>
    const minInput = document.getElementById("minNumber");
    const maxInput = document.getElementById("maxNumber");
    const quantityInput = document.getElementById("quantity");
    const duplicateOption = document.getElementById("duplicateOption");

    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const randomNumbers = document.getElementById("randomNumbers");
    const errorMessage = document.getElementById("errorMessage");

    function secureRandomInteger(min, max) {
      const range = max - min + 1;
      const limit = Math.floor(4294967296 / range) * range;
      const randomValues = new Uint32Array(1);
      let value;

      do {
        crypto.getRandomValues(randomValues);
        value = randomValues[0];
      } while (value >= limit);

      return min + (value % range);
    }

    function generateNumbers() {
      const min = Number(minInput.value);
      const max = Number(maxInput.value);
      const quantity = Number(quantityInput.value);
      const allowDuplicates = duplicateOption.value === "yes";

      errorMessage.style.display = "none";
      result.style.display = "none";

      if (
        minInput.value.trim() === "" ||
        maxInput.value.trim() === "" ||
        quantityInput.value.trim() === "" ||
        !Number.isSafeInteger(min) ||
        !Number.isSafeInteger(max) ||
        !Number.isSafeInteger(quantity)
      ) {
        showError("Please enter valid whole numbers.");
        return;
      }

      if (min > max) {
        showError("Minimum number cannot be greater than maximum number.");
        return;
      }

      if (quantity < 1 || quantity > 100) {
        showError("Please generate between 1 and 100 numbers.");
        return;
      }

      const range = max - min + 1;

      if (!Number.isSafeInteger(range) || range <= 0) {
        showError("Please choose a smaller number range.");
        return;
      }

      if (!allowDuplicates && quantity > range) {
        showError("There are not enough unique numbers in this range.");
        return;
      }

      const numbers = [];

      if (allowDuplicates) {
        for (let i = 0; i < quantity; i++) {
          numbers.push(secureRandomInteger(min, max));
        }
      } else {
        const pool = Array.from({ length: range }, (_, i) => min + i);

        for (let i = 0; i < quantity; i++) {
          const randomIndex = secureRandomInteger(i, range - 1);
          [pool[i], pool[randomIndex]] = [pool[randomIndex], pool[i]];
          numbers.push(pool[i]);
        }
      }

      randomNumbers.textContent = numbers.join(", ");
      result.style.display = "block";
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    generateBtn.addEventListener("click", generateNumbers);

    document.getElementById("againBtn").addEventListener("click", generateNumbers);

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const text = randomNumbers.textContent;

      try {
        await navigator.clipboard.writeText(text);
        document.getElementById("copyBtn").textContent = "Copied!";
      } catch {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = text;
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        document.execCommand("copy");
        temporaryInput.remove();
        document.getElementById("copyBtn").textContent = "Copied!";
      }
    });
  </script>

</body>
</html>
