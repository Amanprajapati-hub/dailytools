
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate strong random passwords for free. Customize password length, letters, numbers and symbols with DailyTools.">
    <title>Password Generator | DailyTools</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .password-section {
            padding: 65px 0 100px;
        }

        .password-box {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #e9e9f1;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(35, 30, 100, 0.05);
        }

        .password-box label {
            display: block;
            color: #17172b;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .password-output {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        #passwordResult {
            flex: 1;
            min-width: 0;
            padding: 16px;
            border: 1px solid #dedee9;
            border-radius: 10px;
            background: #f8f8ff;
            color: #17172b;
            font-family: monospace;
            font-size: 16px;
        }

        #copyPassword {
            border: none;
            background: #f0efff;
            color: #635bff;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .length-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #lengthValue {
            color: #635bff;
            font-weight: 800;
            font-size: 20px;
        }

        #passwordLength {
            width: 100%;
            accent-color: #635bff;
            cursor: pointer;
            margin-bottom: 28px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border: 1px solid #e9e9f1;
            border-radius: 10px;
            color: #44445a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .option-item input {
            width: 17px;
            height: 17px;
            accent-color: #635bff;
            cursor: pointer;
        }

        .generate-button {
            width: 100%;
            border: none;
            padding: 16px;
            background: #635bff;
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .generate-button:hover {
            background: #5048e5;
        }

        #passwordStatus {
            min-height: 20px;
            margin-top: 15px;
            color: #635bff;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .password-box {
                padding: 20px;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .password-output {
                flex-direction: column;
            }

            #copyPassword {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="container nav-container">
        <a href="index.html" class="logo">DailyTools<span>.</span></a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="tools.html" class="active">All Tools</a>
            <a href="index.html#categories">Categories</a>
            <a href="about.html">About</a>
        </nav>

        <a href="tools.html" class="btn btn-primary nav-cta">Explore Tools</a>
    </div>
</header>

<main>
    <section class="page-hero">
        <div class="container">
            <span class="eyebrow">FREE ONLINE GENERATOR</span>
            <h1>Password <span>Generator.</span></h1>
            <p>Create strong, random passwords with customizable length and character options.</p>
        </div>
    </section>

    <section class="password-section">
        <div class="container">

            <div class="password-box">

                <label for="passwordResult">Your generated password</label>

                <div class="password-output">
                    <input
                        type="text"
                        id="passwordResult"
                        placeholder="Your password will appear here"
                        readonly
                        aria-label="Generated password"
                    >
                    <button type="button" id="copyPassword">Copy</button>
                </div>

                <div class="length-row">
                    <label for="passwordLength">Password Length</label>
                    <span id="lengthValue">16</span>
                </div>

                <input
                    type="range"
                    id="passwordLength"
                    min="8"
                    max="64"
                    value="16"
                >

                <div class="options-grid">

                    <label class="option-item">
                        <input type="checkbox" id="uppercase" checked>
                        Uppercase Letters (A-Z)
                    </label>

                    <label class="option-item">
                        <input type="checkbox" id="lowercase" checked>
                        Lowercase Letters (a-z)
                    </label>

                    <label class="option-item">
                        <input type="checkbox" id="numbers" checked>
                        Numbers (0-9)
                    </label>

                    <label class="option-item">
                        <input type="checkbox" id="symbols" checked>
                        Symbols (!@#$)
                    </label>

                </div>

                <button type="button" class="generate-button" id="generatePassword">
                    Generate Strong Password
                </button>

                <p id="passwordStatus" role="status" aria-live="polite"></p>

            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container footer-content">
        <a href="index.html" class="logo">DailyTools<span>.</span></a>
        <p>Simple tools for everyday tasks.</p>
        <p class="copyright">© 2026 DailyTools. All rights reserved.</p>
    </div>
</footer>

<script>
    const lengthSlider = document.getElementById("passwordLength");
    const lengthValue = document.getElementById("lengthValue");
    const passwordResult = document.getElementById("passwordResult");
    const passwordStatus = document.getElementById("passwordStatus");

    lengthSlider.addEventListener("input", () => {
        lengthValue.textContent = lengthSlider.value;
    });

    function secureRandomInt(max) {
        const random = new Uint32Array(1);
        const limit = Math.floor(4294967296 / max) * max;

        do {
            crypto.getRandomValues(random);
        } while (random[0] >= limit);

        return random[0] % max;
    }

    function generatePassword() {
        const groups = [];

        if (document.getElementById("uppercase").checked) {
            groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
        }

        if (document.getElementById("lowercase").checked) {
            groups.push("abcdefghijklmnopqrstuvwxyz");
        }

        if (document.getElementById("numbers").checked) {
            groups.push("0123456789");
        }

        if (document.getElementById("symbols").checked) {
            groups.push("!@#$%^&*()_+-=[]{};:,.?");
        }

        if (groups.length === 0) {
            passwordResult.value = "";
            passwordStatus.textContent = "Please select at least one character type.";
            return;
        }

        const length = Number(lengthSlider.value);

        if (length < groups.length) {
            passwordStatus.textContent =
                "Increase the length to include every selected character type.";
            return;
        }

        const allCharacters = groups.join("");
        const password = [];

        // Include at least one character from each selected group.
        groups.forEach(group => {
            password.push(group[secureRandomInt(group.length)]);
        });

        // Fill remaining positions with secure random characters.
        while (password.length < length) {
            password.push(allCharacters[secureRandomInt(allCharacters.length)]);
        }

        // Securely shuffle the characters.
        for (let i = password.length - 1; i > 0; i--) {
            const j = secureRandomInt(i + 1);
            [password[i], password[j]] = [password[j], password[i]];
        }

        passwordResult.value = password.join("");
        passwordStatus.textContent = "Strong password generated successfully!";
    }

    document.getElementById("generatePassword")
        .addEventListener("click", generatePassword);

    document.getElementById("copyPassword")
        .addEventListener("click", async () => {
            if (!passwordResult.value) {
                passwordStatus.textContent = "Generate a password first.";
                return;
            }

            try {
                await navigator.clipboard.writeText(passwordResult.value);
                passwordStatus.textContent = "Password copied successfully!";
            } catch {
                passwordResult.select();
                const copied = document.execCommand("copy");
                passwordStatus.textContent = copied
                    ? "Password copied successfully!"
                    : "Please copy the password manually.";
            }
        });

    generatePassword();
</script>

</body>
</html>
