
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate your exact age in years, months and days with the free DailyTools Age Calculator.">
  <title>Age Calculator | DailyTools</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .age-wrapper {
      max-width: 760px;
      margin: 60px auto;
      padding: 35px;
      background: #fff;
      border: 1px solid #e9e9f1;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(30, 30, 60, 0.06);
    }

    .age-wrapper h1 { margin-bottom: 12px; }
    .age-wrapper > p { color: #666; margin-bottom: 28px; }

    .age-wrapper label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .age-wrapper input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
      margin-bottom: 22px;
    }

    .age-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #635bff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .age-button:hover { background: #5048e5; }

    .age-result {
      display: none;
      margin-top: 28px;
      padding: 24px;
      background: #f5f5ff;
      border-radius: 14px;
      text-align: center;
    }

    .age-result h2 { margin-bottom: 20px; }

    .age-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .age-stat {
      padding: 18px 8px;
      background: white;
      border-radius: 12px;
    }

    .age-stat strong {
      display: block;
      font-size: 28px;
      color: #635bff;
    }

    .age-stat span { color: #666; font-size: 14px; }

    .age-error {
      display: none;
      color: #d93025;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      .age-wrapper { margin: 30px 15px; padding: 22px; }
      .age-stats { gap: 7px; }
      .age-stat { padding: 14px 4px; }
      .age-stat strong { font-size: 23px; }
    }
  </style>
</head>

<body>

  <main class="age-wrapper">
    <h1>Age Calculator</h1>
    <p>Find your exact age in years, months and days.</p>

    <label for="birthDate">Enter your date of birth</label>
    <input type="date" id="birthDate">

    <button class="age-button" id="calculateBtn">Calculate Age</button>

    <p class="age-error" id="errorMessage" role="alert"></p>

    <section class="age-result" id="result" aria-live="polite">
      <h2>Your Exact Age</h2>

      <div class="age-stats">
        <div class="age-stat">
          <strong id="years">0</strong>
          <span>Years</span>
        </div>
        <div class="age-stat">
          <strong id="months">0</strong>
          <span>Months</span>
        </div>
        <div class="age-stat">
          <strong id="days">0</strong>
          <span>Days</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const birthDateInput = document.getElementById("birthDate");
    const calculateBtn = document.getElementById("calculateBtn");
    const result = document.getElementById("result");
    const errorMessage = document.getElementById("errorMessage");

    // Prevent selecting a future date
    const today = new Date();
    const localToday = new Date(
      today.getTime() - today.getTimezoneOffset() * 60000
    ).toISOString().split("T")[0];

    birthDateInput.max = localToday;

    calculateBtn.addEventListener("click", () => {
      const value = birthDateInput.value;

      errorMessage.style.display = "none";
      result.style.display = "none";

      if (!value) {
        showError("Please enter your date of birth.");
        return;
      }

      const [year, month, day] = value.split("-").map(Number);
      const birth = new Date(year, month - 1, day);
      const current = new Date();

      if (
        birth.getFullYear() !== year ||
        birth.getMonth() !== month - 1 ||
        birth.getDate() !== day ||
        birth > current
      ) {
        showError("Please enter a valid date of birth.");
        return;
      }

      let years = current.getFullYear() - year;
      let months = current.getMonth() - (month - 1);
      let days = current.getDate() - day;

      if (days < 0) {
        months--;
        const previousMonthDays = new Date(
          current.getFullYear(),
          current.getMonth(),
          0
        ).getDate();
        days += previousMonthDays;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("years").textContent = years;
      document.getElementById("months").textContent = months;
      document.getElementById("days").textContent = days;

      result.style.display = "block";
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }
  </script>

</body>
</html>
